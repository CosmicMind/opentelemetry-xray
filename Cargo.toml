[package]
name = "opentelemetry-xray"
version = "0.1.4"
edition = "2021"
description = "A library for AWS X‑Ray distributed tracing using OpenTelemetry."
license = "MIT"
repository = "https://github.com/cosmicmind/opentelemetry-xray"

[dependencies]
opentelemetry = { version = "0.28.0", features = ["trace"] }
opentelemetry-aws = "0.16.0"
opentelemetry_sdk = { version = "0.28.0", features = ["rt-tokio"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = [
    "env-filter",
    "json",
    "time",
    "chrono",
] }
tracing-opentelemetry = "0.29.0"
thiserror = "2.0.11"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
rand_core = { version = "0.9.0", features = ["std", "os_rng"] }
http = "1.2.0"
futures-util = "0.3.31"
